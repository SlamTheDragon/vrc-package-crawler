"$schema" = "./node_modules/wrangler/config-schema.json"
name = "vrc-package-crawler"
compatibility_date = "2026-10-02"
compatibility_flags = ["nodejs_compat"]
main = "src/worker_entry.ts"
workers_dev = true
preview_urls = false

[secrets]
required = ["OPERATOR_TOKEN"]

[[d1_databases]]
binding = "VRCP_D1"
database_id = "722bdd0d-92ca-445b-9319-da0b27adf7b2"
remote = false

# Persistent preview Worker with a separate owner-provisioned database.
[env.preview]
name = "vrc-package-crawler-preview"
workers_dev = true
preview_urls = false

[env.preview.secrets]
required = ["OPERATOR_TOKEN"]

[[env.preview.d1_databases]]
binding = "VRCP_D1"
database_id = "fbef6ce1-4145-45ae-ae91-5d617a1f2672"
remote = false

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true

[env.preview.observability]
enabled = true

[env.preview.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[env.preview.observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true
