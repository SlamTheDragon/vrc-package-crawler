name = "vrc-coordinator"
main = "src/worker/worker_entry.ts"
compatibility_date = "2024-09-30"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "vrc-coordinator-db"
database_id = "placeholder-d1-id"

[env.staging]
name = "vrc-coordinator-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "vrc-coordinator-staging-db"
database_id = "placeholder-staging-d1-id"
