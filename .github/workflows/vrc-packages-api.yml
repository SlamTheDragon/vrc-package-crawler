name: SDK tagged artifact and channel npm publication

# NPM_TOKEN is owner-configured. The package and API review holds remain explicit.

on:
  push:
    tags: ['vrcp-api/v*']
  workflow_dispatch:
    inputs:
      diagnose-preview-oidc:
        description: Check preview publisher identity and token exchange without publishing.
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sdk-${{ contains(github.ref_name, '-pre') && 'preview' || 'release' }}
  cancel-in-progress: false
jobs:
  preview-trust-check:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose-preview-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    environment: vrcp-api-preview
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Check non-secret OIDC claims and npm exchange status
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          try {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'npm:registry.npmjs.org');
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              redirect: 'error', signal: AbortSignal.timeout(30_000)
            });
            if (!response.ok) throw new Error('OIDC request failed');
            const { value } = await response.json();
            if (typeof value !== 'string' || value.split('.').length !== 3) throw new Error('Invalid OIDC response');
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'));
            const keys = ['aud', 'sub', 'repository', 'repository_owner', 'workflow_ref', 'job_workflow_ref', 'runner_environment'];
            const identity = Object.fromEntries(keys.map(key => [key,
              typeof claims[key] === 'string' && claims[key].length <= 500 ? claims[key] : null]));
            console.log(JSON.stringify({ action: 'preview-oidc-identity', ...identity }));
            const exchange = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/vrc-packages-api-preview', {
              method: 'POST', headers: { authorization: `Bearer ${value}`, accept: 'application/json' },
              redirect: 'error', signal: AbortSignal.timeout(30_000)
            });
            // Never print the JWT, exchange body, publish token or request headers.
            console.log(JSON.stringify({ action: 'preview-oidc-exchange', status: exchange.status }));
            await exchange.body?.cancel();
            if (!exchange.ok) process.exitCode = 1;
          } catch {
            console.error('Preview trust diagnostic failed. No package publication ran.');
            process.exitCode = 1;
          }
          NODE
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.route.outputs.channel }}
      environment: ${{ steps.route.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm install --ignore-scripts --package-lock=false
      - id: route
        run: node scripts/delivery.mjs tag "$GITHUB_REF_NAME"
      - run: node scripts/versioning.mjs sync '${{ steps.route.outputs.channel }}'
      - run: bun test ./tests
      - run: node scripts/delivery.mjs prepare '${{ steps.route.outputs.channel }}' package --ci
      - run: node scripts/delivery.mjs verify '${{ steps.route.outputs.channel }}' package --ci
      - run: node scripts/delivery.mjs pack '${{ steps.route.outputs.channel }}' package --ci
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ steps.route.outputs.channel }}
          path: |
            src-package/.artifacts/ci/*.tgz
            src-package/.artifacts/ci/*.tgz.json
          include-hidden-files: true
          if-no-files-found: error
  release-assets:
    needs: [build, publish]
    if: ${{ always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-assets.yml
  publish:
    needs: build
    permissions:
      contents: read
      id-token: write
    # Separate package identities and environments. Release v0.1 remains held in delivery.mjs.
    if: (needs.build.outputs.channel == 'release' && vars.VRCP_SDK_PUBLISH_APPROVED == 'true') || (needs.build.outputs.channel == 'preview' && vars.VRCP_SDK_PREVIEW_PUBLISH_APPROVED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.environment }}
      # This links the channel's registry, not an unapproved staged version.
      url: https://www.npmjs.com/package/${{ needs.build.outputs.channel == 'preview' && 'vrc-packages-api-preview' || 'vrc-packages-api' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm install --ignore-scripts --package-lock=false
      - run: node scripts/versioning.mjs sync '${{ needs.build.outputs.channel }}'
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ needs.build.outputs.channel }}
          path: src-package/.artifacts/ci/
      - name: Install supported staging CLI
        run: npm install --global npm@11.19.0
      - name: Stage checked release SDK and compare registry staging bytes
        if: needs.build.outputs.channel == 'release'
        run: node scripts/delivery.mjs publish '${{ needs.build.outputs.channel }}' package --ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish checked preview SDK through its trusted publisher
        if: needs.build.outputs.channel == 'preview'
        run: node scripts/delivery.mjs publish preview package --ci
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ needs.build.outputs.channel }}-${{ needs.build.outputs.channel == 'preview' && 'publication' || 'stage' }}
          path: src-package/.artifacts/ci/*.tgz.${{ needs.build.outputs.channel == 'preview' && 'published' || 'stage' }}.json
          include-hidden-files: true
          if-no-files-found: error
