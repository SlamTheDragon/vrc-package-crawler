name: Website tagged static artifact
on:
  push:
    tags: ['web/v*']
permissions:
  contents: read
jobs:
  build:
    if: false
    # Owner defers website CI and hosting selection. Local development builds remain available.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --no-save --ignore-scripts
      - id: route
        run: node scripts/delivery.mjs tag "$GITHUB_REF_NAME"
      - run: node scripts/versioning.mjs sync '${{ steps.route.outputs.channel }}'
      - run: bun test ./tests
      - run: node scripts/delivery.mjs prepare '${{ steps.route.outputs.channel }}' web --ci
      - run: node scripts/delivery.mjs build '${{ steps.route.outputs.channel }}' web --ci
      - name: Package only the static output
        run: |
          mkdir -p src-web/.artifacts/ci
          tar -czf 'src-web/.artifacts/ci/vrcp-web-${{ steps.route.outputs.version }}.tgz' -C src-web/dist .
          node scripts/release-assets.mjs stamp '${{ steps.route.outputs.channel }}' web src-web/.artifacts/ci
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ steps.route.outputs.version }}
          path: |
            src-web/.artifacts/ci/*.tgz
            src-web/.artifacts/ci/web.receipt.json
          include-hidden-files: true
          if-no-files-found: error
      # Hosting, API origin and Firebase setup remain separate owner decisions.
  release-assets:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-assets.yml
