name: Network Package
run-name: ${{ inputs.recovery-tag && format('Recover network {0}', inputs.recovery-tag) || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      recovery-tag:
        description: Exact authorized failed tag. Preserve its product source and version.
        type: string
        required: true
  push:
    tags: ['vrcp-network/v*']
permissions:
  contents: read
  actions: read
  pull-requests: read
env:
  GH_TOKEN: ${{ github.token }}
  VRCP_RECOVERY_TAG: ${{ inputs.recovery-tag || '' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery-tag || github.ref }}
          fetch-depth: 0
      - name: Restore reviewed recovery tooling only
        if: inputs.recovery-tag != ''
        run: git restore --source="$GITHUB_SHA" --worktree --no-overlay -- scripts tests package.json .github
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/dependency-cache
        with:
          project: network
      - run: bun install --no-save --ignore-scripts
      - id: route
        run: node scripts/delivery.mjs tag "${VRCP_RECOVERY_TAG:-$GITHUB_REF_NAME}"
      - name: Verify predecessor publication before build
        if: inputs.recovery-tag == ''
        run: node scripts/delivery-chain.mjs verify-predecessor "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/versioning.mjs sync '${{ steps.route.outputs.channel }}'
      - run: bun test ./tests
        env:
          VRCP_RECOVERY_TAG: ''
      - run: node scripts/delivery.mjs prepare '${{ steps.route.outputs.channel }}' network --ci
      - run: node scripts/delivery.mjs verify '${{ steps.route.outputs.channel }}' network --ci
      - run: node scripts/delivery.mjs pack '${{ steps.route.outputs.channel }}' network --ci
      - uses: actions/upload-artifact@v4
        with:
          name: network-${{ steps.route.outputs.version }}
          path: |
            src-worker/packages/network/.artifacts/ci/*.tgz
            src-worker/packages/network/.artifacts/ci/*.tgz.json
          include-hidden-files: true
          if-no-files-found: error
      # Public/private registry selection is not implied by artifact packaging.
  release-assets:
    needs: build
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ inputs.recovery-tag || '' }}
  deployment-record:
    needs: release-assets
    runs-on: ubuntu-latest
    environment:
      name: vrcp-network
      url: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.recovery-tag || github.ref_name }}
    steps:
      - run: echo 'Release assets passed the attachment checks.'
