name: Internal network tagged artifact
on:
  push:
    tags: ['vrcp-network/v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm install --ignore-scripts --package-lock=false
      - id: route
        run: node scripts/delivery.mjs tag "$GITHUB_REF_NAME"
      - run: node scripts/versioning.mjs sync '${{ steps.route.outputs.channel }}'
      - run: bun test ./tests
      - run: node scripts/delivery.mjs prepare '${{ steps.route.outputs.channel }}' network --ci
      - run: npm --prefix src-package run test:distribution
      - run: node scripts/delivery.mjs verify '${{ steps.route.outputs.channel }}' network --ci
      - run: node scripts/delivery.mjs pack '${{ steps.route.outputs.channel }}' network --ci
      - uses: actions/upload-artifact@v4
        with:
          name: network-${{ steps.route.outputs.version }}
          path: |
            src-worker/packages/network/.artifacts/ci/*.tgz
            src-worker/packages/network/.artifacts/ci/*.tgz.json
          include-hidden-files: true
          if-no-files-found: error
      # Public/private registry selection is not implied by artifact packaging.
  release-assets:
    needs: build
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-assets.yml
