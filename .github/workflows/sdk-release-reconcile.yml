name: Publish verified SDK release drafts
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  # GitHub lists draft releases only for callers with push access.
  contents: write
  actions: write
concurrency:
  group: sdk-release-draft-check
  cancel-in-progress: false
jobs:
  check-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --ignore-scripts --package-lock=false
      - run: node scripts/release-assets.mjs reconcile
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
