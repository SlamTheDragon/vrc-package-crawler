name: Cache Maintenance
on:
  workflow_run:
    workflows:
      - Package API
      - Network Package
      - Crawler Node
      - Crawler Client
      - Cloudflare Worker
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vrcp-cache-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.repository == 'SlamTheDragon/vrc-packages' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never checkout a triggering tag, PR, artifact, or fork in this privileged job.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun run cache:check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
