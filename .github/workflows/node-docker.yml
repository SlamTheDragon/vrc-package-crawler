name: Build & Publish Crawler Node Container
run-name: ${{ inputs.recovery-tag && format('Recover crawler {0}', inputs.recovery-tag) || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      recovery-tag:
        description: Exact owner-reviewed failed crawler tag. Recovery runs only from main and never changes its source or version.
        type: string
        required: true
  push:
    tags:
      - 'vrcp-crawler/v*'

permissions:
  contents: read
  actions: read
  pull-requests: read
# Standalone artifacts are not yet an installation/supervision contract for the Tauri shell.
concurrency:
  group: crawler-${{ contains(github.ref_name, '-pre') && 'preview' || 'release' }}
  cancel-in-progress: false
  queue: max
env:
  GH_TOKEN: ${{ github.token }}
  VRCP_RECOVERY_TAG: ${{ inputs.recovery-tag || '' }}
jobs:
  build-linux:
    runs-on: ubuntu-latest
    needs: route
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery-tag || github.ref }}
          fetch-depth: 0
      - name: Restore reviewed recovery tooling only
        if: inputs.recovery-tag != ''
        run: |
          set -euo pipefail
          git restore --source="$GITHUB_SHA" --worktree --no-overlay -- scripts tests package.json .github
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/dependency-cache
        with:
          project: crawler
      - run: bun install --no-save --ignore-scripts
      - run: node scripts/versioning.mjs sync '${{ needs.route.outputs.channel }}'
      - run: bun test ./tests
        env:
          VRCP_RECOVERY_TAG: ''
      - run: node scripts/delivery.mjs prepare '${{ needs.route.outputs.channel }}' crawler --ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package contracts and node
        run: |
          bun run --cwd src-crawler typecheck
          bun run --cwd src-crawler test
          node scripts/delivery.mjs build '${{ needs.route.outputs.channel }}' crawler --ci
          src-crawler/dist/dev/vrcp-crawler-node-linux --help
      - run: node scripts/release-assets.mjs stamp '${{ needs.route.outputs.channel }}' crawler src-crawler/dist/dev linux
      - uses: actions/upload-artifact@v4
        with:
          name: crawler-${{ needs.route.outputs.version }}-linux-x64
          path: |
            src-crawler/dist/dev/vrcp-crawler-node-linux
            src-crawler/dist/dev/crawler-linux.receipt.json
          if-no-files-found: error
      - name: Supply only packed dependencies to Docker
        run: |
          mkdir -p src-crawler/.ci-artifacts
          cp src-package/.artifacts/dev/*.tgz src-crawler/.ci-artifacts/
          cp src-worker/packages/network/.artifacts/dev/*.tgz src-crawler/.ci-artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: dependencies
        name: Read configured dependency identities
        run: |
          node --input-type=module -e 'import {readVersionConfig,sdkChannelForProduct,sdkPackageNames} from "./scripts/versioning.mjs"; const c=sdkChannelForProduct("crawler",process.env.VRCP_BUILD_CHANNEL); const {config:v}=await readVersionConfig(c); console.log("sdk-name="+sdkPackageNames[c]); console.log("sdk-version="+v[c+"-package"]); console.log("network-version="+(await readVersionConfig("preview")).config["preview-network"]);' >> "$GITHUB_OUTPUT"
        env:
          VRCP_BUILD_CHANNEL: ${{ needs.route.outputs.channel }}

      - name: Check the container before publishing
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: src-crawler
          file: src-crawler/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: vrcp-node-check:${{ needs.route.outputs.commit }}
          build-args: |
            VRCP_BUILD_CHANNEL=${{ needs.route.outputs.channel }}
            VRCP_SDK_VERSION=${{ steps.dependencies.outputs.sdk-version }}
            VRCP_NETWORK_VERSION=${{ steps.dependencies.outputs.network-version }}
          labels: |
            org.opencontainers.image.version=${{ needs.route.outputs.version }}
            org.opencontainers.image.revision=${{ needs.route.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.vrcp.channel=${{ needs.route.outputs.channel }}
            io.vrcp.sdk.name=${{ steps.dependencies.outputs.sdk-name }}
            io.vrcp.sdk.version=${{ steps.dependencies.outputs.sdk-version }}
            io.vrcp.network.version=${{ steps.dependencies.outputs.network-version }}
      - name: Check Linux runtime, restart persistence and missing-token failure without network access
        run: |
          image="vrcp-node-check:$VRCP_SOURCE_COMMIT"
          volume="vrcp-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          container="vrcp-no-token-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker volume create "$volume"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null' EXIT
          test "$(docker run --rm --network none "$image" --version)" = "$VRCP_EXPECTED_VERSION"
          docker run --rm --network none "$image" --help
          docker run --rm --network none --volume "$volume:/app/data" "$image" init ci-runtime-check
          docker run --rm --network none --volume "$volume:/app/data" --entrypoint sh "$image" -c 'test "$(id -u)" -ne 0 && test -s node.config.json && printf ci-persistence > persistence-check'
          docker run --rm --network none --volume "$volume:/app/data" --entrypoint sh "$image" -c 'test "$(cat persistence-check)" = ci-persistence && test -s node.config.json'
          set +e
          timeout 20s docker run --name "$container" --rm --network none --volume "$volume:/app/data" "$image"
          status=$?
          set -e
          test "$status" -eq 1
        env:
          VRCP_EXPECTED_VERSION: ${{ needs.route.outputs.version }}
          VRCP_SOURCE_COMMIT: ${{ needs.route.outputs.commit }}
      - name: Save the checked image without a second build
        run: node scripts/container-delivery.mjs seal '${{ needs.route.outputs.channel }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ci-only-crawler-${{ needs.route.outputs.version }}-container
          path: |
            src-crawler/.artifacts/ci/container/container.tar
            src-crawler/.artifacts/ci/container/container.receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  standalone-windows:
    needs: route
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery-tag || github.ref }}
          fetch-depth: 0
      - name: Restore reviewed recovery tooling only
        if: inputs.recovery-tag != ''
        run: |
          set -euo pipefail
          git restore --source="$GITHUB_SHA" --worktree --no-overlay -- scripts tests package.json .github
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/dependency-cache
        with:
          project: crawler
      - run: bun install --no-save --ignore-scripts
      - run: node scripts/versioning.mjs sync '${{ needs.route.outputs.channel }}'
      - run: bun test ./tests
        env:
          VRCP_RECOVERY_TAG: ''
      - run: node scripts/delivery.mjs prepare '${{ needs.route.outputs.channel }}' crawler --ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run --cwd src-crawler typecheck
      - run: bun run --cwd src-crawler test
      - run: node scripts/delivery.mjs build '${{ needs.route.outputs.channel }}' crawler --ci
      - run: src-crawler/dist/dev/vrcp-crawler-node.exe --version
      - run: node scripts/release-assets.mjs stamp '${{ needs.route.outputs.channel }}' crawler src-crawler/dist/dev windows
      - uses: actions/upload-artifact@v4
        with:
          name: crawler-${{ needs.route.outputs.version }}-windows-x64
          path: |
            src-crawler/dist/dev/vrcp-crawler-node.exe
            src-crawler/dist/dev/crawler-windows.receipt.json
          if-no-files-found: error
  route:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.route.outputs.channel }}
      environment: ${{ steps.route.outputs.environment }}
      version: ${{ steps.route.outputs.version }}
      commit: ${{ steps.route.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery-tag || github.ref }}
          fetch-depth: 0
      - name: Restore reviewed recovery tooling only
        if: inputs.recovery-tag != ''
        run: |
          set -euo pipefail
          git restore --source="$GITHUB_SHA" --worktree --no-overlay -- scripts tests package.json .github
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/dependency-cache
        with:
          project: root
      - run: bun install --no-save --ignore-scripts
      - id: route
        run: node scripts/delivery.mjs tag "${VRCP_RECOVERY_TAG:-$GITHUB_REF_NAME}"
      - name: Verify predecessor publication before build
        if: inputs.recovery-tag == ''
        run: node scripts/delivery-chain.mjs verify-predecessor "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
  publish-container:
    needs: [route, build-linux, standalone-windows]
    if: needs.route.outputs.channel == 'preview' || (needs.route.outputs.channel == 'release' && vars.VRCP_CONTAINER_PUBLISH_APPROVED == 'true' && vars.VRCP_CRAWLER_RELEASE_PUBLISH_APPROVED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.route.outputs.channel == 'preview' && 'vrcp-crawler-preview' || 'vrcp-crawler-release' }}
      url: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.recovery-tag || github.ref_name }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery-tag || github.ref }}
          fetch-depth: 0
      - name: Restore reviewed recovery tooling only
        if: inputs.recovery-tag != ''
        run: |
          set -euo pipefail
          git restore --source="$GITHUB_SHA" --worktree --no-overlay -- scripts tests package.json .github
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/dependency-cache
        with:
          project: root
      - run: bun install --no-save --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ci-only-crawler-${{ needs.route.outputs.version }}-container
          path: src-crawler/.artifacts/ci/container
      - name: Check archive and loaded image before registry login
        run: node scripts/container-delivery.mjs load '${{ needs.route.outputs.channel }}'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked bytes to the selected image package
        run: node scripts/container-delivery.mjs publish '${{ needs.route.outputs.channel }}'
        env:
          VRCP_CONTAINER_PUBLISH_APPROVED: ${{ vars.VRCP_CONTAINER_PUBLISH_APPROVED }}
          VRCP_CRAWLER_RELEASE_PUBLISH_APPROVED: ${{ vars.VRCP_CRAWLER_RELEASE_PUBLISH_APPROVED }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-only-crawler-${{ needs.route.outputs.version }}-publication
          path: src-crawler/.artifacts/ci/container-publication.json
          include-hidden-files: true
          if-no-files-found: error
  release-assets:
    needs: [build-linux, standalone-windows, publish-container]
    if: always() && needs.build-linux.result == 'success' && needs.standalone-windows.result == 'success' && (needs.publish-container.result == 'success' || needs.publish-container.result == 'skipped')
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ inputs.recovery-tag || '' }}
