name: Build & Publish Crawler Client

# Independent Windows shell build. No bundled crawler or updater contract is implied.

on:
  push:
    tags: ['vrcp-crawler-client/v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.route.outputs.channel }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --ignore-scripts --package-lock=false
      - id: route
        run: node scripts/delivery.mjs tag "$GITHUB_REF_NAME"
      - run: node scripts/versioning.mjs sync '${{ steps.route.outputs.channel }}'
      - run: bun test ./tests
      - run: node scripts/delivery.mjs prepare '${{ steps.route.outputs.channel }}' crawler-client --ci
      - run: npm --prefix src-crawler-client run check
      - run: node scripts/delivery.mjs build '${{ steps.route.outputs.channel }}' crawler-client --ci
      - run: node scripts/release-assets.mjs stamp '${{ steps.route.outputs.channel }}' crawler-client src-crawler-client/src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: crawler-client-${{ steps.route.outputs.version }}-windows-unsigned
          path: |
            src-crawler-client/src-tauri/target/release/bundle/msi/*.msi
            src-crawler-client/src-tauri/target/release/bundle/nsis/*-setup.exe
            src-crawler-client/src-tauri/target/release/bundle/crawler-client.receipt.json
          if-no-files-found: error
  release-assets:
    needs: build
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-assets.yml
  deployment-record:
    needs: [build, release-assets]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.channel == 'preview' && 'vrcp-crawler-client-preview' || 'vrcp-crawler-client-release' }}
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - run: echo 'Release assets passed the attachment checks.'
# ensure output only expose msi installer or exe installer if ever defined, if not, set up build configs in related source code
