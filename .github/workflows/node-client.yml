name: Build & Publish Crawler Client
run-name: ${{ inputs.recovery-tag && format('Recover crawler-client {0}', inputs.recovery-tag) || github.ref_name }}

# Independent Windows shell build. No bundled crawler or updater contract is implied.

on:
  workflow_dispatch:
    inputs:
      recovery-tag:
        description: Exact authorized failed tag. Preserve its product source and version.
        type: string
        required: true
  push:
    tags: ['vrcp-crawler-client/v*']
permissions:
  contents: read
  actions: read
  pull-requests: read
env:
  GH_TOKEN: ${{ github.token }}
  VRCP_RECOVERY_TAG: ${{ inputs.recovery-tag || '' }}
jobs:
  build:
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.route.outputs.channel }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery-tag || github.ref }}
          fetch-depth: 0
      - name: Restore reviewed recovery tooling only
        if: inputs.recovery-tag != ''
        run: git restore --source="$GITHUB_SHA" --worktree --no-overlay -- scripts tests package.json .github
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/dependency-cache
        with:
          project: crawler-client
      - run: bun install --no-save --ignore-scripts
      - id: route
        run: node scripts/delivery.mjs tag "${VRCP_RECOVERY_TAG:-$GITHUB_REF_NAME}"
      - run: node scripts/versioning.mjs sync '${{ steps.route.outputs.channel }}'
      - run: bun test ./tests
        env:
          VRCP_RECOVERY_TAG: ''
      - run: node scripts/delivery.mjs prepare '${{ steps.route.outputs.channel }}' crawler-client --ci
      - run: bun run --cwd src-crawler-client check
      - run: node scripts/delivery.mjs build '${{ steps.route.outputs.channel }}' crawler-client --ci
      - run: node scripts/release-assets.mjs stamp '${{ steps.route.outputs.channel }}' crawler-client src-crawler-client/src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: crawler-client-${{ steps.route.outputs.version }}-windows-unsigned
          path: |
            src-crawler-client/src-tauri/target/release/bundle/msi/*.msi
            src-crawler-client/src-tauri/target/release/bundle/nsis/*-setup.exe
            src-crawler-client/src-tauri/target/release/bundle/crawler-client.receipt.json
          if-no-files-found: error
  release-assets:
    needs: build
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ inputs.recovery-tag || '' }}
# ensure output only expose msi installer or exe installer if ever defined, if not, set up build configs in related source code
