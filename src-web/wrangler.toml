"$schema" = "./node_modules/wrangler/config-schema.json"
name = "vrc-package-crawler"
compatibility_date = "2026-10-02"
compatibility_flags = ["nodejs_compat"]
main = "src/worker/worker_entry.ts"
workers_dev = true
preview_urls = true

[secrets]
required = ["OPERATOR_TOKEN"]

[[d1_databases]]
binding = "DB"
database_id = "722bdd0d-92ca-445b-9319-da0b27adf7b2"
remote = false

# Existing preview resource is shared. Do not deploy preview writes before isolating it.
[[previews.d1_databases]]
binding = "DB"
database_id = "722bdd0d-92ca-445b-9319-da0b27adf7b2"
remote = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[previews.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[previews.observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[previews.observability.issue_detection]
enabled = false
